spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/davisign_bridge
spring.datasource.username=davisign
spring.datasource.password=davisign

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=8080

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Base publica donde corre este backend; se usa para armar el link/QR de cada firmante.
app.base-url=http://localhost:8080
