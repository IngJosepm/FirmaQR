spring.application.name=backend

# Credenciales reales (Gmail, contrasena de aplicacion) viven en secrets.properties,
# que NO esta en git (ver .gitignore). Ese archivo solo existe localmente en cada
# maquina donde corra el backend.
spring.config.import=optional:file:./secrets.properties

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.datasource.url=jdbc:postgresql://localhost:15432/davisign_bridge
spring.datasource.username=davisign
spring.datasource.password=davisign

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=8080

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# Base publica donde corre este backend; se usa para armar el link/QR de cada
# firmante. Debe ser la IP de la PC en la red local (NO localhost), porque el
# QR lo abre el CELULAR, no la PC -- "localhost" en el celular se referiria a
# si mismo. Mientras no haya dominio/VM real, usar la IP de la red Wi-Fi.
app.base-url=http://192.168.18.29:8080
