<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>DaviSign Bridge — Gestión documentaria</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: system-ui, sans-serif; max-width: 860px; margin: 32px auto; padding: 0 16px; color: #1a1a2e; }
  h1 { font-size: 22px; }
  form { background: #f4f4f8; padding: 16px; border-radius: 8px; margin-bottom: 24px; }
  label { display: block; font-size: 13px; font-weight: bold; margin-top: 10px; }
  input[type=text], input[type=file] { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
  button { margin-top: 14px; background: #1a1a2e; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e0e0e0; font-size: 14px; }
  .estado { padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: bold; }
  .PENDIENTE { background: #fde8c8; color: #8a5b00; }
  .PARCIAL { background: #d6e8ff; color: #0a4a99; }
  .FIRMADO { background: #d7f3e0; color: #0a7c42; }
  .doc-card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 14px; margin-top: 14px; }
  .firmantes img { width: 64px; height: 64px; vertical-align: middle; }
  .btn-icono { background: none; border: none; cursor: pointer; font-size: 18px; vertical-align: middle; margin-left: 6px; }
  .agregar-firmante { margin-top: 10px; display: flex; gap: 6px; }
  .agregar-firmante input { flex: 1; padding: 6px; }
  .agregar-firmante button { margin-top: 0; padding: 6px 12px; font-size: 13px; }
</style>
</head>
<body>
  <h1>DaviSign Bridge — Gestión documentaria</h1>

  <form id="formDoc">
    <label>Documento PDF</label>
    <input type="file" id="pdf" accept="application/pdf" required>

    <label>Correos de los firmantes (uno por línea, en el orden en que deben firmar)</label>
    <textarea id="correos" rows="4" style="width:100%; box-sizing:border-box; padding:8px; margin-top:4px;" placeholder="persona1@correo.com&#10;persona2@correo.com"></textarea>

    <button type="submit">Crear documento y generar QR</button>
  </form>

  <div id="lista"></div>

<script>
const API = "/api/documentos";

async function cargarLista() {
  const res = await fetch(API);
  const docs = await res.json();
  const cont = document.getElementById("lista");
  cont.innerHTML = "";
  for (const doc of docs.sort((a,b) => b.creadoEn.localeCompare(a.creadoEn))) {
    const div = document.createElement("div");
    div.className = "doc-card";
    div.innerHTML = `
      <strong>${doc.nombreArchivo}</strong>
      <span class="estado ${doc.estado}">${doc.estado}</span>
      <button class="btn-icono" title="Ver / descargar PDF" onclick="window.open('${API}/${doc.id}/pdf', '_blank')">👁️</button>
      <table>
        <thead><tr><th>#</th><th>Correo</th><th>Estado</th><th>Firmado en</th><th>QR</th></tr></thead>
        <tbody>
          ${doc.firmantes.map(f => `
            <tr>
              <td>${f.orden + 1}</td>
              <td>${f.correo}</td>
              <td><span class="estado ${f.estado}">${f.estado}</span></td>
              <td>${f.firmadoEn ? new Date(f.firmadoEn).toLocaleString() : "—"}</td>
              <td class="firmantes">${f.estado === "PENDIENTE" ? `<img src="${f.qrUrl}" alt="QR">` : ""}</td>
            </tr>`).join("")}
        </tbody>
      </table>
      <div class="agregar-firmante">
        <input type="text" placeholder="agregar.otro@correo.com" id="nuevoCorreo-${doc.id}">
        <button type="button" onclick="agregarFirmante('${doc.id}')">+ Agregar firmante</button>
      </div>`;
    cont.appendChild(div);
  }
}

async function agregarFirmante(docId) {
  const input = document.getElementById("nuevoCorreo-" + docId);
  const correo = input.value.trim();
  if (!correo) return;

  const form = new FormData();
  form.append("correo", correo);
  const res = await fetch(`${API}/${docId}/firmantes`, { method: "POST", body: form });
  if (!res.ok) {
    alert("Error: " + await res.text());
    return;
  }
  input.value = "";
  cargarLista();
}

document.getElementById("formDoc").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const pdf = document.getElementById("pdf").files[0];
  const correos = document.getElementById("correos").value
      .split("\n").map(s => s.trim()).filter(Boolean);

  const form = new FormData();
  form.append("pdf", pdf);
  correos.forEach(c => form.append("correos", c));

  const res = await fetch(API, { method: "POST", body: form });
  if (!res.ok) {
    alert("Error: " + await res.text());
    return;
  }
  ev.target.reset();
  cargarLista();
});

cargarLista();
setInterval(cargarLista, 4000); // refresco automático del estado
</script>
</body>
</html>
